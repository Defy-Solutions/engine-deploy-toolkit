apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: vs-_APP_NAME_
  namespace: _NAMESPACE_
spec:
  hosts:
    - "_ISTIO_FULL_URL_"
  gateways:
    - default/_MTLS_GATEWAY_SECONDARY_
    - default/_ISTIO_GATEWAY_
  tls:
    # So se aplica ao listener PASSTHROUGH do gateway secundario. O
    # match.port deve ser igual a porta do listener mTLS configurado pela
    # infra (definido em mtls_tls_port no metadata.json do app).
    - match:
        - port: _MTLS_TLS_PORT_
          sniHosts:
            - "_ISTIO_FULL_URL_"
      route:
        - destination:
            host: _APP_NAME_
            port:
              number: 8443
  http:
    # v2 e exclusivo mTLS — nunca deve chegar ao app por HTTP puro.
    - match:
        - uri:
            prefix: /api/v2
      directResponse:
        status: 421
        body:
          string: '{"error":"mTLS obrigatorio: use o endpoint TLS na porta _MTLS_TLS_PORT_"}'
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: _APP_NAME_
            port:
              number: _PORT_
      timeout: 30s
